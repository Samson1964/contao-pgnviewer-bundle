# Quelle fuer die Metadaten im Contao Manager (contao/package-metadata).
# Aenderungen hier werden von Claude in den Fork uebertragen.
# Der englische Block wird beim Abgleich ergaenzt, falls er fehlt.

de:
    title: PGN-Betrachter
    description: >
        Stellt ein Inhaltselement bereit, mit dem du Schachpartien im PGN-Format auf deiner Website abspielen lassen kannst.

        Als Anzeige-Engine dient der PGN-Viewer von Chesstempo, der für den Einsatz in Contao angepasst wurde.

        Diese Erweiterung wurde ursprünglich von Wilfried Krebbers entwickelt. Frank Binding übernahm die Weiterentwicklung.
    keywords:
        - Schach
        - PGN
        - Partien
        - Schachbrett
    support:
        issues: https://github.com/Samson1964/contao-pgnviewer-bundle/issues
        source: https://github.com/Samson1964/contao-pgnviewer-bundle

en:
    title: PGN viewer
    description: >
        Provides a content element that lets you replay chess games in PGN format on your website.

        The display engine is the PGN viewer by Chesstempo, adapted for use in Contao.

        This extension was originally developed by Wilfried Krebbers. Frank Binding has taken over its further development.
    keywords:
        - chess
        - PGN
        - games
        - chessboard
    support:
        issues: https://github.com/Samson1964/contao-pgnviewer-bundle/issues
        source: https://github.com/Samson1964/contao-pgnviewer-bundle
